---
- name: Download Tomcat package from URL on localhost
  hosts: localhost
  become: yes
  tasks:
    - name: Create directory for downloading package
      file:
        path: "/opt/tomcat"
        state: directory
        mode: '0755'
        owner: root
        group: root
    - name: Download Tomcat package using get_url
      get_url:
        url: "https://archive.apache.org/dist/tomcat/tomcat-9/v9.0.73/bin/apache-tomcat-9.0.73.tar.gz"
        dest: "/opt/tomcat/apache-tomcat-9.0.73.tar.gz"
        mode: 0755
        owner: root 
        group: root