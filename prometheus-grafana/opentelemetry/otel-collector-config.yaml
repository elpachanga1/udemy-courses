receivers:
  # Recibe trazas, métricas y logs vía OTLP (OpenTelemetry Protocol)
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Recibe métricas propias del collector
  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          scrape_interval: 10s
          static_configs:
            - targets: ['localhost:8888']

processors:
  # Procesa datos por lotes para mayor eficiencia
  batch:
    timeout: 10s
    send_batch_size: 1024

  # Añade atributos de recursos
  resource:
    attributes:
      - key: environment
        value: production
        action: upsert

  # Limita el uso de memoria
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

exporters:
  # Exporta trazas a la consola (para debugging)
  logging:
    loglevel: info

  # Exporta métricas a Prometheus
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: otel
    const_labels:
      source: opentelemetry

  # Exporta métricas en formato Prometheus Remote Write
  prometheusremotewrite:
    endpoint: "http://prometheus:9090/api/v1/write"
    tls:
      insecure: true

  # Exporta logs a Loki
  loki:
    endpoint: "http://loki:3100/loki/api/v1/push"
    format: json
    labels:
      resource:
        service.name: "service_name"
      attributes:
        level: "severity"

  # Exporta trazas a Jaeger (opcional)
  # jaeger:
  #   endpoint: jaeger:14250
  #   tls:
  #     insecure: true

extensions:
  # Health check endpoint
  health_check:
    endpoint: 0.0.0.0:13133

  # Expone métricas del collector
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, zpages]
  
  pipelines:
    # Pipeline para trazas (traces)
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [logging]
      # Si usas Jaeger, añade: exporters: [logging, jaeger]

    # Pipeline para métricas
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch, resource]
      exporters: [logging, prometheus, prometheusremotewrite]

    # Pipeline para logs
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [logging, loki]

  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888
