# my global config
global:
  scrape_interval: 15s # Set the scrape interval to every 15 seconds. Default is every 1 minute.
  evaluation_interval: 15s # Evaluate rules every 15 seconds. The default is every 1 minute.
  # scrape_timeout is set to the global default (10s).

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
  - "rule/alerts.yml"
  - "rule/recording_rules.yml"
  - "rule/pushgateway_rules.yml"
  # - "second_rules.yml"

# A scrape configuration containing exactly one endpoint to scrape:
# Here it's Prometheus itself.
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: "prometheus"

    # metrics_path defaults to '/metrics'
    # scheme defaults to 'http'.

    static_configs:
      - targets: ["localhost:9090"]
       # The label name is added as a label `label_name=<label_value>` to any timeseries scraped from this config.
        labels:
          app: "prometheus"

  - job_name: "app_server_node_exporter"

    # metrics_path defaults to '/metrics'
    # scheme defaults to 'http'.

    static_configs:
      - targets: ["localhost:9100"]
       # The label name is added as a label `label_name=<label_value>` to any timeseries scraped from this config.
        labels:
          app: "app_server_node_exporter"

  # Pushgateway - Permite a trabajos batch/efímeros enviar métricas
  - job_name: "push_gateway"
    honor_labels: true  # Preserva labels de los jobs que envían métricas
    static_configs:
      - targets: ["localhost:9091"]
        labels:
          app: "push_gateway"

  # Ejemplo usando file_sd_configs para cargar targets desde archivo
  - job_name: "targets_from_file"
    file_sd_configs:
      - files:
          - 'targets/api.yml'
        refresh_interval: 30s  # Refresca el archivo cada 30 segundos
