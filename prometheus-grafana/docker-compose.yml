version: '3.8'

networks:
  monitoring:
    driver: bridge

services:
  # Prometheus - Métricas
  prometheus:
    image: prometheus-custom
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus-server/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/prometheus-server/rule:/etc/prometheus/rule
    networks:
      - monitoring
    restart: unless-stopped

  # Loki - Logs
  loki:
    image: loki-custom
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml
    networks:
      - monitoring
    restart: unless-stopped

  # Promtail - Agente de logs
  promtail:
    image: promtail-custom
    container_name: promtail
    ports:
      - "9080:9080"
    volumes:
      - /var/log:/var/log:ro
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml
    networks:
      - monitoring
    depends_on:
      - loki
    restart: unless-stopped

  # OpenTelemetry Collector
  otel-collector:
    image: otel-collector
    container_name: otel-collector
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Prometheus metrics
      - "8889:8889"   # Prometheus exporter
      - "13133:13133" # Health check
    volumes:
      - ./opentelemetry/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    networks:
      - monitoring
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  # Grafana - Visualización
  grafana:
    image: grafana-custom
    container_name: grafana
    ports:
      - "3030:3030"
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini
      - grafana-data:/var/lib/grafana
    networks:
      - monitoring
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_SERVER_HTTP_PORT=3030

volumes:
  grafana-data:
