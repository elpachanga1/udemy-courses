groups:
  - name: Alerts
    rules:
      - alert: HighCPUUsage
        expr: cpu_usage > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU Usage Detected"
          description: "The CPU usage has been above 80% for more than 5 minutes."
      - alert: Is Node Exporter UP
        expr: up{job="node_exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Node Exporter is Down"
          description: "The node exporter has been down for more than 1 minute."