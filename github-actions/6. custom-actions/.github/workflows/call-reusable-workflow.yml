name: Reusable Workflow Caller
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  call-reusable-workflow:
    uses: ./.github/workflows/reusable-workflow.yml
    with:
      environment: 'production'
      deploy-target: 'app-server'
    secrets:
      deployment-token: ${{ secrets.GITHUB_TOKEN }}
