# RoleBindings: asocian cada ServiceAccount con su Role correspondiente.
# Cada componente sólo puede ejercer los permisos definidos en su propio Role.

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: server-role-binding
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: server-role
subjects:
  - kind: ServiceAccount
    name: server-sa
    namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
