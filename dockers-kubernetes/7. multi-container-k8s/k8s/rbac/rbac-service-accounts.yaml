# ServiceAccounts dedicadas para cada componente de la aplicación.
# Principio de mínimo privilegio: cada workload tiene su propia identidad.
# automountServiceAccountToken: false porque ningún pod llama a la API de Kubernetes.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: server-sa
  namespace: default
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker-sa
  namespace: default
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: client-sa
  namespace: default
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-sa
  namespace: default
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis-sa
  namespace: default
automountServiceAccountToken: false
